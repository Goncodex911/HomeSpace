<body class="min-h-screen flex flex-col overflow-x-hidden">

<main class="flex-grow flex flex-col md:flex-row min-h-screen">
<!-- Left Side: Architectural Interior Photo -->

<div class="absolute inset-0 auth-image-overlay z-10"></div>
<img alt="Luxury Interior" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 hover:scale-105" data-alt="An expansive, light-filled minimalist architectural living room featuring a singular sculptural designer chair placed on a polished concrete floor. Large floor-to-ceiling windows reveal a soft, misty morning light that washes over a neutral color palette of cream, charcoal, and warm wood. The scene captures a sophisticated gallery-like atmosphere with vast negative space and architectural precision. The overall mood is serene, luxurious, and timelessly curated." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEWhWuXVsm4CULvR7CKtQdIEhwgaxM6LU57SNTG0nfgaqCg59IgSvLuhuyl79prK_XHOry-9TRFNDg2HDBBiHw_QojE7epdKmWPjBdUiN4pReR6NrRpJrNewa8LZmAMCRneVFYn2PKwaLV5NaTMishIoSxaJKg6CIfmNC6reV2HqCMYef7Ti1vaiWlfyCDvAYPb4FsPrF9dMLonJPtuBOjhFgaWzk-6r2QQl6XZGe_C2btBvqhhvLw5piJXFb_pYNH4h9PIH8kUElV"/>

</div>
</section>
<!-- Right Side: Clean White Login Panel -->
<section class="w-full md:w-1/2 flex items-center justify-center px-margin-mobile md:px-margin-desktop bg-surface-container-lowest">
<div class="w-full max-w-[440px] py-12 md:py-0">
<header class="mb-12">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your curated collection and design preferences.</p>
</header>
<form class="space-y-10" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2" for="email">Email Address</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/50 focus:ring-0 transition-all duration-300" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative">
<div class="flex justify-between items-center mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-3 px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/50 focus:ring-0 transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 bottom-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 20;">visibility</span>
</button>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps uppercase py-5 px-unit-gutter tracking-widest hover:bg-secondary transition-colors duration-300 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                            Sign In
                        </button>
</div>
</form>

</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 18;">fingerprint</span>

</button>
</div>

</p>

<!-- Simple Footer (As per JSON hierarchy logic for non-top-level but allowed for legal info) -->
<footer class="w-full bg-surface py-unit-gutter px-margin-desktop border-t border-outline-variant/20 flex flex-col md:flex-row justify-between items-center gap-4">

<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Contact</a>
</div>
</footer>
<script>
        // Micro-interaction for input floating feel (though keeping it minimal per guidelines)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('button .material-symbols-outlined');
        if (toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const passwordInput = document.getElementById('password');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.textContent = 'visibility';
                }
            });
        }
    </script>
</body></html>
